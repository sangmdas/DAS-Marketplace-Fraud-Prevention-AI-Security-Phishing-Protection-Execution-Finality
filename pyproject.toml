[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "das-marketplace-fraud-prevention"
version = "0.1.0"
description = "Non-production VLOP fraud-prevention / execution-finality reference model"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "fastapi>=0.110"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
